<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>What's That Word! — Leaderboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root { --card-bg: #fff; --muted:#666; }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 24px; background: #f5f7fb; color:#111; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    h1 { margin:0; font-size:28px; }
    .actions { display:flex; gap:8px; }
    a.btn, button.btn {
      text-decoration:none; border:1px solid #ddd; background:#fff; color:#111; padding:10px 14px; border-radius:12px; cursor:pointer;
      font-weight:600;
    }
    a.btn:hover, button.btn:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .bar { display:flex; gap:12px; align-items:center; margin:18px 0 8px; flex-wrap:wrap; }
    select { padding:8px 10px; border-radius:10px; border:1px solid #ddd; background:#fff; }
    .grid { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:12px; margin:12px 0 24px; }
    .card {
      background:var(--card-bg); border-radius:16px; padding:16px; border:1px solid #eaeaea;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .card h3 { margin:0 0 6px; font-size:13px; color:var(--muted); text-transform: uppercase; letter-spacing:.04em; }
    .card .big { font-size:26px; font-weight:800; }
    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #eaeaea; border-radius:16px; overflow:hidden; }
    th, td { padding:10px 12px; border-bottom:1px solid #f0f0f0; text-align:left; font-size:14px; }
    th { background:#fafafa; color:#333; }
    tbody tr:hover { background:#fafcff; }
    .section { margin:22px 0; }
    .empty { color:#777; padding:14px; }
    footer { margin-top:24px; color:#777; font-size:12px; }
    @media (max-width:900px){
      .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width:520px){
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Leaderboard</h1>
    <div class="actions">
      <a class="btn" href="index.html">← Back to Game</a>
      <button class="btn" id="clearBtn" title="Delete all local scores">Clear Leaderboard</button>
    </div>
  </header>

  <div class="bar">
    <label for="modeFilter">Mode:</label>
    <select id="modeFilter">
      <option value="all">All</option>
      <option value="fun">Fun</option>
      <option value="school">School</option>
    </select>
  </div>

  <section class="grid" id="summaryGrid">
    <div class="card"><h3>Games</h3><div class="big" id="sumGames">0</div></div>
    <div class="card"><h3>Wins</h3><div class="big" id="sumWins">0</div></div>
    <div class="card"><h3>Win Rate</h3><div class="big" id="sumWR">0%</div></div>
    <div class="card"><h3>Streak (Best / Current)</h3><div class="big"><span id="sumBest">0</span> / <span id="sumCurrent">0</span></div></div>
  </section>

  <section class="section">
    <h2>Top 10 — Fastest Wins</h2>
    <div id="fastestWrap"></div>
  </section>

  <section class="section">
    <h2>Top 10 — Fewest Wrong Guesses (Wins)</h2>
    <div id="fewestWrap"></div>
  </section>

  <section class="section">
    <h2>Recent Games</h2>
    <div id="recentWrap"></div>
  </section>

  <footer>Scores are stored only in your browser via <code>localStorage</code>.</footer>

  <script src="leaderboard.js"></script>
</body>
</html>
