<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's That Word!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            text-align: center;
            color: black;
        }

        /* canvas is the background */
        #bg {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /*UI sits on top (maybe change idk yet) */
        #gameContainer {
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        button {
            margin: 5px;
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="gameContainer">
    <h1>Welcome to What's That Word!</h1>

    <!-- instuction and mode selection -->
    <div >
        <p>Choose </p>
        <button onclick = "location.href= 'instructions.html'">Instructions</button>
        <button onclick="location.href = 'index.html'">Modes</button>
    </div>

</div>

<script src="main.js"></script>
</body>
</html>
